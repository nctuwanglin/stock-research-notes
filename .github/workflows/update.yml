name: 盤後自動更新研究筆記(現價偏移/資料齡/處置同步/催化劑日曆/三大法人籌碼)

on:
  schedule:
    # 每週一至週五 13:20 UTC = 台灣時間 21:20(盤後,錯開 twse-disposition 的 21:00)
    - cron: "20 13 * * 1-5"

  # 允許手動觸發(測試用)
  workflow_dispatch:

jobs:
  update-freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run parser tests
        run: python -m unittest discover -s tests -q

      - name: Run freshness update script
        run: python scripts/update_freshness.py

      # 籌碼腳本在任一市場來源全滅時會 exit 1。這裡刻意 continue-on-error:
      # 直接失敗會跳過下面的 commit,連當天的現價/資料齡更新一起丟掉。
      # 改由最後一步依 outcome 讓整個 workflow 轉紅(與 US quotes 同一套作法)。
      - name: Run chips update script
        id: chips
        continue-on-error: true
        run: python scripts/update_chips.py

      # 一致性驗證:擋住「同一個數字散落多處卻互相矛盾」的錯誤進到線上。
      # 目前全站 ERROR 已歸零,故用 --strict 讓 CI 在有 ERROR 時轉紅。
      # WARN(四情境點等距、停損已觸發等)不阻擋,只在 log 中呈現。
      - name: Validate dashboard consistency
        run: python scripts/validate_dashboards.py --strict

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet index.html data/prices.json data/chips.json ./*.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Taipei date "+%Y/%m/%d %H:%M")
          git add ./*.html data/prices.json data/chips.json
          git commit -m "auto: 盤後更新現價偏移/資料齡/處置同步/三大法人籌碼 ${DATE}"
          git push

      - name: Verify US quotes
        run: |
          python3 -c "
          import json, sys
          e = json.load(open('data/prices.json')).get('errors') or []
          print('errors:', e)
          sys.exit(1 if e else 0)
          "

      - name: Verify chips
        if: steps.chips.outcome == 'failure'
        run: |
          echo "籌碼更新失敗(見上方 Run chips update script 步驟),來源可能已改版"
          exit 1
